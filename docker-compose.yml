version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: organic_chicken_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: organic_chicken
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
